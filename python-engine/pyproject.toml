[tool.poetry]
name = "yggdrasil-engine"
version = "1.3.1"
description = "Engine for evaluating Unleash feature flags"
authors = ["Simon Hornby <liquidwicked64@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "yggdrasil_engine" }
]
include = [
    "yggdrasil_engine/lib/*"
]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
tox = "^4.0.0"
ruff = "^0.16.1"
basedpyright = "^1.39.9"

[tool.poetry.build]
generate-setup-file = false

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

lint.select = [
    "E",   # pycodestyle, error
    "W",   # pycodestyle, warning
    "F",   # pyflakes
    "PL",  # pylint
    "YTT", # flake8-2020
    "I",   # isort
]
lint.ignore = ["E501", "PLR2004"]
lint.fixable = ["I"]

[tool.ruff.lint.pylint]
max-args = 25

[tool.basedpyright]
pythonVersion = "3.8"
include = ["yggdrasil_engine", "tests"]
