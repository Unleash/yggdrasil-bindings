[package]
edition = "2021"
name = "yggdrasil-pyo3"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]
name = "yggdrasil_native"

[features]
test-helpers = []

[dependencies]
chrono = "0.4.42"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0.135"
unleash-types = { version = "0.16.1", default-features = false }
unleash-yggdrasil = { version = "0.21.5" }

[profile.release]
lto = true
codegen-units = 1
