[package]
edition = "2021"
name = "yggdrasil-pyo3"
version = "0.0.0"
publish = false

[lib]
crate-type = ["cdylib"]
name = "yggdrasil_native"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1.0.135"
unleash-yggdrasil = { version = "0.21.5" }

[dev-dependencies]
chrono = "0.4.42"
unleash-types = { version = "0.16.1", default-features = false }
