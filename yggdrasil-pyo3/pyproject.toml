[project]
name = "yggdrasil-engine"
version = "3.0.0a1"
description = "Engine for evaluating Unleash feature flags"
authors = [{ name = "Simon Hornby", email = "liquidwicked64@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "yggdrasil_engine.yggdrasil_native"
exclude = ["python/yggdrasil_engine/**/__pycache__/**"]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "ruff>=0.16.1,<0.17",
    "maturin>=1.15,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["python", "tests"]

lint.select = [
    "E",   # pycodestyle, error
    "W",   # pycodestyle, warning
    "F",   # pyflakes
    "PL",  # pylint
    "YTT", # flake8-2020
    "I",   # isort
]
lint.ignore = ["E501", "PLR2004"]
lint.fixable = ["I"]

[tool.ruff.lint.isort]
# a maturin's project native module is a compiled .so file that only exists after a build and has no .py
known-first-party = ["yggdrasil_engine"]
