[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "node_engine"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.6.5"
unleash-yggdrasil = { version = "0.21.5" }
serde_json = "1.0.154"
unleash-types = { version = "0.16.1", default-features = false }

[dependencies.napi]
version = "3.12.4"
features = ["napi8"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
