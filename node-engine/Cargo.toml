[package]
edition = "2021"
name = "node_engine"
version = "0.1.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
wasm-bindgen = "=0.2.129"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
unleash-yggdrasil = { version = "0.21.7", features = ["wasm-types"] }
serde_json = "1.0.154"
serde = { version = "1.0.217", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["wasmbind"] }

[profile.release]
lto = true
strip = "symbols"
