name: Publish Python engine (PyO3)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only: no upload to PyPI, no tag"
        type: boolean
        default: true
  ## TEMPORARY, REMOVE BEFORE MERGING
  push:
    branches:
      - feat/python-engine-pyo3-packaging

jobs:
  build-wheels:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: macos-x86_64
            runner: macos-14
            target: x86_64
          - name: macos-arm64
            runner: macos-14
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64
    env:
      ## same minimum macOS as the 2.x wheels (macosx_11_0)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6

      ## Linux builds run inside manylinux/musllinux containers that bring their
      ## own Python; macOS and Windows need one on the runner
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: yggdrasil-pyo3
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: yggdrasil-pyo3/dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: yggdrasil-pyo3
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: yggdrasil-pyo3/dist/*.tar.gz


  test-linux:
    name: test linux ${{ matrix.arch }}
    needs: build-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels

      - name: List wheels
        run: ls -l wheels

      - name: Install and smoke test
        run: |
          failed=0
          check() { # $1 = label, $2 = image, $3 = python executable
            echo "::group::$1 ($2)"
            if docker run --rm --network none -v "$PWD":/w:ro "$2" sh -c \
                "$3 -m pip install -q --disable-pip-version-check --root-user-action=ignore \
                   --no-index --only-binary :all: --find-links /w/wheels yggdrasil-engine \
                 && $3 /w/yggdrasil-pyo3/scripts/smoke_test.py"; then
              echo "PASS: $1"
            else
              echo "FAIL: $1"; failed=1
            fi
            echo "::endgroup::"
          }
          check "glibc, python 3.10" python:3.10-slim   python
          check "glibc, python 3.14" python:3.14-slim   python
          check "musl, python 3.10"  python:3.10-alpine python
          check "musl, python 3.14"  python:3.14-alpine python
          check "glibc 2.17 (CentOS 7), python 3.10" \
            quay.io/pypa/manylinux2014_${{ matrix.arch }} /opt/python/cp310-cp310/bin/python
          exit $failed


  test-native:
    name: test ${{ matrix.runner }} python ${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, python: "3.10" }
          - { runner: macos-15-intel, python: "3.14" }
          - { runner: macos-14, python: "3.10" }
          - { runner: macos-14, python: "3.14" }
          - { runner: windows-latest, python: "3.10" }
          - { runner: windows-latest, python: "3.14" }
          - { runner: windows-11-arm, python: "3.11" }
          - { runner: windows-11-arm, python: "3.14" }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels

      - name: Install and smoke test
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --no-index --only-binary :all: --find-links wheels yggdrasil-engine
          python yggdrasil-pyo3/scripts/smoke_test.py

  ## sdist: pip compiles it from source (Rust is preinstalled on the runner)
  test-sdist:
    needs: build-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist

      - name: Install from source and smoke test
        run: |
          python -m pip install --disable-pip-version-check sdist/*.tar.gz
          python yggdrasil-pyo3/scripts/smoke_test.py

  publish:
    needs: [test-linux, test-native, test-sdist]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Read the engine version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('yggdrasil-pyo3/pyproject.toml', 'rb'))['project']['version'])")
          echo "Python engine version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        run: |
          ls -l dist
          python -m pip install --disable-pip-version-check twine
          twine upload dist/* --skip-existing
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_PUBLISH_KEY }}

      - name: Create tag
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/python-engine-v${{ steps.version.outputs.VERSION }}`,
              sha: context.sha,
            });
